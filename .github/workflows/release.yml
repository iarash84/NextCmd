name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected a semantic version such as v1.0.0 or v1.0.0-rc.1"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release tests
        run: go test ./...

      - name: Build all supported targets
        run: make build-all VERSION="$RELEASE_TAG"

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p release
          zip -j "release/NextCmd-${RELEASE_TAG}-windows-amd64.zip" target/NextCmd-windows-amd64.exe
          zip -j "release/NextCmd-${RELEASE_TAG}-windows-arm64.zip" target/NextCmd-windows-arm64.exe
          tar -C target -czf "release/NextCmd-${RELEASE_TAG}-linux-amd64.tar.gz" NextCmd-linux-amd64
          tar -C target -czf "release/NextCmd-${RELEASE_TAG}-linux-arm64.tar.gz" NextCmd-linux-arm64
          tar -C target -czf "release/NextCmd-${RELEASE_TAG}-darwin-amd64.tar.gz" NextCmd-darwin-amd64
          tar -C target -czf "release/NextCmd-${RELEASE_TAG}-darwin-arm64.tar.gz" NextCmd-darwin-arm64
          cd release
          sha256sum *.zip *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        shell: bash
        run: |
          assets=(release/*.zip release/*.tar.gz release/checksums.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "NextCmd $RELEASE_TAG"
          fi
